name: Homegate
version: "1.1.6"
slug: homegate
image: ghcr.io/josh-richardson/homegate-addon-{arch}
description: Secure remote access to Home Assistant via Homegate tunnels
url: https://github.com/josh-richardson/homegate-addon
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
ingress: true
ingress_port: 8080
panel_icon: mdi:cloud-lock
map:
  - data:rw
init: false
options:
  environment: production
schema:
  environment: list(production|staging)
